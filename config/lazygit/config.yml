quitOnTopLevelReturn: true
notARepository: 'quit'
promptToReturnFromSubprocess: false
gui:
  nerdFontsVersion: "3"
  theme:
    # the default blue background hides the text with the calibrated
    # palette (THEME.md), and reverse works in both light and dark mode
    selectedLineBgColor:
      - reverse
keybinding:
  files:
    commitChanges: 'こ'
    commitChangesWithEditor: 'c'
  commits:
    renameCommit: 'れ'
    renameCommitWithEditor: 'r'
customCommands:
  - key: 'I'
    command: "git rebase -i {{.SelectedLocalCommit.Sha}}^"
    context: 'commits'
    description: 'start interactive rebase'
    output: terminal
